services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao-pedidos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: railway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MKqslCTcmKOdCKZPMbtGTiOZdtFOKsuL
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: gestao-pedidos-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:MKqslCTcmKOdCKZPMbtGTiOZdtFOKsuL@nozomi.proxy.rlwy.net:40159/railway
      JWT_SECRET: f3a5b678c1d2e3f4g5h6i7j8k9l0m1n2o3p4q5r6s7t8u9v0w1x2y3z4a5b6c7d
      PORT: 3333
    ports:
      - "3333:3333"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: gestao-pedidos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
