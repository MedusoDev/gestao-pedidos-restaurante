services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao-pedidos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestao_pedidos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: gestao-pedidos-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gestao_pedidos?schema=public
      JWT_SECRET: super-secret-change-me
      PORT: 3333
    ports:
      - "3333:3333"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: gestao-pedidos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
